name: Release

# Dipicu oleh tag versi (tanpa awalan "v"), mis. 0.5.0. Tag HARUS sama dengan "version" di manifest.json.
on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Tag = versi manifest, dan manifest/package/package-lock/versions.json/CHANGELOG sepakat. Catatan rilis = bagian CHANGELOG versi ini.
      - name: Cek berkas rilis
        run: node scripts/check-release.mjs "${GITHUB_REF_NAME}" --notes release-notes.md
      - run: npm test
      - run: npm run build
      - name: Cek aset rilis
        run: |
          for f in main.js manifest.json styles.css; do [ -s "$f" ] || { echo "Missing release asset $f"; exit 1; }; done
      - name: Attest release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Buat rilis (draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" main.js manifest.json styles.css \
            --title "${GITHUB_REF_NAME}" --notes-file release-notes.md --draft
